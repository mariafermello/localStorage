<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Lista de tarefas</h1>
    <p>Adicione suas tarefas!</p>

    <form id="formTarefa">
      <input id="novaTarefa" type="text" placeholder="Digite uma tarefa..." autocomplete="off">
      <button type="submit">Adicionar</button>
    </form>

    <ul id="listaTarefas"></ul>
    <button id="limparTudo" class="secundario" type="button">Apagar todas</button>
    <p id="mensagem" aria-live="polite"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
